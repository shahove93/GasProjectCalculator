<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СС.Расчет — запуск</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            background:
                radial-gradient(circle at 18% 0%, rgba(45, 212, 191, 0.16), transparent 46%),
                linear-gradient(135deg, #0a1725 0%, #0b1f33 52%, #123a52 100%);
            color: #f2f8fb;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .splash {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 22px 28px 18px;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .emblem {
            width: 64px; height: 64px;
            padding: 5px;
            border-radius: 50%;
            background: #f4f8fb;
            display: grid; place-items: center;
            box-shadow:
                0 0 0 3px rgba(94, 234, 212, 0.28),
                0 8px 20px rgba(0, 0, 0, 0.35);
        }
        .emblem img { width: 100%; height: 100%; display: block; }
        h1 {
            margin: 0;
            font-size: 30px;
            line-height: 1.05;
            letter-spacing: -0.4px;
            font-weight: 800;
        }
        .subtitle {
            margin: 4px 0 0;
            font-size: 14px;
            font-weight: 600;
            color: #5eead4;
            letter-spacing: 0.01em;
        }
        .scene { width: 100%; max-width: 430px; height: auto; display: block; }
        .pipe { fill: none; stroke: #1f4a63; stroke-width: 14; stroke-linecap: round; }
        .pipe-highlight {
            fill: none;
            stroke: rgba(94, 234, 212, 0.22);
            stroke-width: 4;
            stroke-linecap: round;
        }
        .gas {
            fill: #5eead4;
            opacity: 0;
            animation: gas-flow 2.6s linear infinite;
            filter: drop-shadow(0 0 4px rgba(94, 234, 212, 0.75));
        }
        .g1 { animation-delay: 0s; }
        .g2 { animation-delay: 0.65s; }
        .g3 { animation-delay: 1.3s; }
        .g4 { animation-delay: 1.95s; }
        @keyframes gas-flow {
            0%   { transform: translateX(0); opacity: 0; }
            12%  { opacity: 1; }
            82%  { opacity: 1; }
            100% { transform: translateX(270px); opacity: 0; }
        }
        .house .wall { fill: #eef3f7; }
        .house .roof { fill: #2dd4bf; }
        .house .window { fill: #123a52; }
        .house .door { fill: #0f766e; }
        .house .port { fill: #1f4a63; }
        .glow {
            fill: rgba(94, 234, 212, 0.25);
            animation: glow-pulse 2.6s ease-in-out infinite;
        }
        @keyframes glow-pulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 0.6; }
        }
        .status {
            margin: 0;
            font-size: 14px;
            letter-spacing: 0.02em;
            color: #9fb6c6;
        }

        /* Static state: respect the OS setting and the diagnostic override. */
        @media (prefers-reduced-motion: reduce) {
            .gas { animation: none; opacity: 0.45; }
            .g1 { transform: translateX(0); }
            .g2 { transform: translateX(70px); }
            .g3 { transform: translateX(140px); }
            .g4 { transform: translateX(210px); }
            .glow { animation: none; opacity: 0.35; }
        }
        :root[data-reduced-motion="true"] .gas { animation: none; opacity: 0.45; }
        :root[data-reduced-motion="true"] .g1 { transform: translateX(0); }
        :root[data-reduced-motion="true"] .g2 { transform: translateX(70px); }
        :root[data-reduced-motion="true"] .g3 { transform: translateX(140px); }
        :root[data-reduced-motion="true"] .g4 { transform: translateX(210px); }
        :root[data-reduced-motion="true"] .glow { animation: none; opacity: 0.35; }
    </style>
</head>
<body>
    <main class="splash" role="status" aria-live="polite">
        <div class="brand">
            <span class="emblem"><img src="assets/company-emblem.png" alt="" width="54" height="54"></span>
            <div>
                <h1>СС.Расчет</h1>
                <p class="subtitle">Калькулятор ГСН и ГСВ</p>
            </div>
        </div>

        <svg class="scene" viewBox="0 0 460 140" aria-hidden="true" focusable="false">
            <path class="pipe" d="M16 104 H300"></path>
            <path class="pipe-highlight" d="M16 101 H300"></path>

            <circle class="gas g1" cx="26" cy="104" r="5"></circle>
            <circle class="gas g2" cx="26" cy="104" r="5"></circle>
            <circle class="gas g3" cx="26" cy="104" r="5"></circle>
            <circle class="gas g4" cx="26" cy="104" r="5"></circle>

            <g class="house">
                <path class="roof" d="M292 52 L356 10 L420 52 Z"></path>
                <rect class="wall" x="304" y="52" width="104" height="72" rx="4"></rect>
                <rect class="window" x="318" y="66" width="26" height="22" rx="3"></rect>
                <rect class="window" x="368" y="66" width="26" height="22" rx="3"></rect>
                <rect class="door" x="344" y="92" width="24" height="32" rx="2"></rect>
                <rect class="port" x="296" y="98" width="14" height="12" rx="2"></rect>
            </g>
            <circle class="glow" cx="302" cy="104" r="11"></circle>
        </svg>

        <p class="status">Запуск приложения…</p>
    </main>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            if (params.get("reduced-motion") === "1") {
                document.documentElement.setAttribute("data-reduced-motion", "true");
            }
        }());
    </script>
</body>
</html>
